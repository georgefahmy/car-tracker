[project]
name = "car-tracker"
version = "0.1.0"
description = "Reolink NVR Car & Person Tracker with Red-Zone Illegal Parking Detection and Traffic Hotspots"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ultralytics>=8.3.0",
    "lap>=0.5.12",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0,<2.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "openvino>=2024.6.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
